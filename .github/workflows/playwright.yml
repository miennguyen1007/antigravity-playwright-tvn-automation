name: 🎭 Playwright Tests + Allure Report

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - e2e
          - regression
          - all

# ── Permissions needed for GitHub Pages deployment ─────────────
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # JOB 1: Run Playwright Tests
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  test:
    name: 🧪 Run Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project: [smoke:chromium, e2e:chromium]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🔐 Create .env file
        run: |
          cat <<EOF > .env
          BASE_URL=${{ secrets.BASE_URL || 'https://tvn-sut.info' }}
          USER_USERNAME=${{ secrets.USER_USERNAME }}
          USER_PASSWORD=${{ secrets.USER_PASSWORD }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          HEADLESS=true
          EOF

      - name: 🧪 Run ${{ matrix.project }} tests
        run: npx playwright test --project=${{ matrix.project }}
        continue-on-error: true

      - name: 📤 Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 30

      - name: 📤 Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # JOB 2: Generate Allure Report & Deploy to GitHub Pages
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  allure-report:
    name: 📊 Allure Report → GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      # Step 1: Checkout repo (needed for allure-history on gh-pages branch)
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Step 2: Download all allure-results artifacts from test job
      - name: 📥 Download Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: 📂 Verify Allure Results exist
        run: |
          echo "=== Allure Results Contents ==="
          ls -la allure-results/ || echo "No allure-results directory found"
          echo "=== File count ==="
          find allure-results -type f | wc -l

      # Step 3: Fetch existing allure-history from gh-pages branch
      - name: 📜 Fetch Allure History from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 || true
          mkdir -p allure-history
          # Copy previous history if gh-pages exists
          if git show origin/gh-pages:history 2>/dev/null; then
            git checkout origin/gh-pages -- history/ 2>/dev/null || true
            cp -r history/* allure-history/ 2>/dev/null || true
          fi
          echo "History entries: $(ls allure-history/ 2>/dev/null | wc -l)"

      # Step 4: Generate Allure Report with trend history
      - name: 📊 Generate Allure Report
        uses: simple-elf/allure-report-action@v1.9
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20
          github_run_num: ${{ github.run_number }}

      # Step 5: Deploy to GitHub Pages (gh-pages branch)
      - name: 🚀 Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          keep_files: false

      # Step 6: Post report URL as job summary
      - name: 📝 Report URL
        if: always()
        run: |
          REPO_NAME="${{ github.repository }}"
          OWNER=$(echo $REPO_NAME | cut -d'/' -f1)
          REPO=$(echo $REPO_NAME | cut -d'/' -f2)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Report URL:** [https://${OWNER}.github.io/${REPO}/](https://${OWNER}.github.io/${REPO}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_(It may take 1-2 minutes for GitHub Pages to update)_" >> $GITHUB_STEP_SUMMARY
