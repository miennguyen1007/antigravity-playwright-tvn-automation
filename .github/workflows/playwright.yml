name: Playwright CI + Allure

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_suite:
        description: Test suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - e2e
          - regression
          - all

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run selected test suite
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USER_USERNAME: ${{ secrets.USER_USERNAME }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          HEADLESS: 'true'
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            npx playwright test --project=smoke:chromium --project=e2e:chromium
          else
            case "${{ inputs.test_suite }}" in
              smoke)
                npx playwright test --project=smoke:chromium
                ;;
              e2e)
                npx playwright test --project=e2e:chromium --project=mobile:chrome
                ;;
              regression)
                npx playwright test --project=regression:chromium --project=regression:firefox --project=regression:webkit
                ;;
              all)
                npx playwright test
                ;;
              *)
                echo "Unsupported test suite: ${{ inputs.test_suite }}"
                exit 1
                ;;
            esac
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  allure-report:
    name: Generate Allure report
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result != 'cancelled'
    permissions:
      contents: read
    outputs:
      report_ready: ${{ steps.report-ready.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-artifact-found: ignore

      - name: Restore Allure history
        if: hashFiles('allure-results/*-result.json') != ''
        run: |
          mkdir -p allure-results/history
          git fetch origin gh-pages --depth=1 || true
          if git rev-parse --verify --quiet origin/gh-pages >/dev/null; then
            if git ls-tree -d --name-only origin/gh-pages history | grep -qx history; then
              git archive origin/gh-pages history | tar -x
              cp -R history/. allure-results/history/
              rm -rf history
            fi
          fi

      - name: Generate Allure report
        if: hashFiles('allure-results/*-result.json') != ''
        run: npx allure generate allure-results --clean -o allure-report

      - name: Check report output
        id: report-ready
        if: always()
        run: |
          if [ -f allure-report/index.html ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Allure report
        if: steps.report-ready.outputs.value == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

  deploy-report:
    name: Publish Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: allure-report
    if: always() && needs.allure-report.result == 'success' && needs.allure-report.outputs.report_ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          keep_files: false

      - name: Add report URL to job summary
        run: |
          echo "## Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
